<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ISBN 書籍情報 ルックアップ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-4">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">ISBN 書籍情報 ルックアップ</h1>

    <!-- 検索フォーム -->
    <div class="bg-white rounded-lg shadow p-6 mb-6">
      <h2 class="text-lg font-semibold text-gray-700 mb-4">ISBN 検索</h2>
      <div class="flex gap-3">
        <input id="isbnInput" type="text" placeholder="例: 9784873119038 または 4873119030" class="flex-1 border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-400" aria-label="ISBN番号" maxlength="17" />
        <button id="searchBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-5 py-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-400" tabindex="0" aria-label="検索">検索</button>
      </div>
      <p class="text-xs text-gray-400 mt-2">ISBN-13（13桁）またはISBN-10（10桁）。ハイフンなし/ありどちらでも可。OpenLibrary API を使用。</p>
      <div id="searchStatus" class="mt-3 text-sm" aria-live="polite"></div>
    </div>

    <!-- 書籍情報表示 -->
    <div id="bookCard" class="bg-white rounded-lg shadow p-6 mb-6 hidden">
      <div class="flex gap-6">
        <div class="flex-shrink-0">
          <img id="bookCover" src="" alt="書影" class="w-28 rounded shadow" onerror="this.style.display='none'" />
        </div>
        <div class="flex-1">
          <h2 id="bookTitle" class="text-xl font-bold text-gray-800 mb-1"></h2>
          <p id="bookAuthor" class="text-gray-500 text-sm mb-2"></p>
          <div class="grid grid-cols-2 gap-x-6 gap-y-1 text-sm text-gray-600 mb-4">
            <div><span class="font-medium">出版社:</span> <span id="bookPublisher"></span></div>
            <div><span class="font-medium">出版年:</span> <span id="bookYear"></span></div>
            <div><span class="font-medium">ページ数:</span> <span id="bookPages"></span></div>
            <div><span class="font-medium">ISBN:</span> <span id="bookISBN"></span></div>
          </div>
          <!-- 読書記録フォーム -->
          <div class="border-t pt-4">
            <h3 class="text-sm font-semibold text-gray-700 mb-3">読書記録</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
              <div>
                <label class="block text-xs text-gray-500 mb-1" for="readDate">読了日</label>
                <input id="readDate" type="date" class="w-full border border-gray-200 rounded px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-blue-300" aria-label="読了日" />
              </div>
              <div>
                <label class="block text-xs text-gray-500 mb-1" for="readRating">評価</label>
                <select id="readRating" class="w-full border border-gray-200 rounded px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-blue-300" aria-label="評価">
                  <option value="">未評価</option>
                  <option value="5">★★★★★ 5</option>
                  <option value="4">★★★★☆ 4</option>
                  <option value="3">★★★☆☆ 3</option>
                  <option value="2">★★☆☆☆ 2</option>
                  <option value="1">★☆☆☆☆ 1</option>
                </select>
              </div>
              <div class="md:col-span-1">
                <label class="block text-xs text-gray-500 mb-1" for="readMemo">メモ</label>
                <input id="readMemo" type="text" placeholder="ひとことメモ" class="w-full border border-gray-200 rounded px-2 py-1.5 text-sm focus:outline-none focus:ring-1 focus:ring-blue-300" aria-label="メモ" />
              </div>
            </div>
            <button id="saveRecordBtn" class="mt-3 bg-green-600 hover:bg-green-700 text-white text-sm font-medium px-5 py-2 rounded focus:outline-none focus:ring-2 focus:ring-green-400" tabindex="0" aria-label="読書記録を保存">読書記録を保存</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 読書記録一覧 -->
    <div class="bg-white rounded-lg shadow p-6">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold text-gray-700">読書記録一覧</h2>
        <button id="clearRecordsBtn" class="bg-red-500 hover:bg-red-600 text-white text-sm font-medium px-4 py-2 rounded focus:outline-none focus:ring-2 focus:ring-red-400" tabindex="0" aria-label="記録を全て削除">全件削除</button>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm" role="grid" aria-label="読書記録一覧">
          <thead>
            <tr class="bg-gray-100 text-gray-600 text-left">
              <th class="px-3 py-2 font-medium" scope="col">書名</th>
              <th class="px-3 py-2 font-medium" scope="col">著者</th>
              <th class="px-3 py-2 font-medium" scope="col">ISBN</th>
              <th class="px-3 py-2 font-medium" scope="col">読了日</th>
              <th class="px-3 py-2 font-medium" scope="col">評価</th>
              <th class="px-3 py-2 font-medium" scope="col">メモ</th>
              <th class="px-3 py-2 font-medium" scope="col">操作</th>
            </tr>
          </thead>
          <tbody id="recordBody">
            <tr><td colspan="7" class="text-center text-gray-400 py-6">記録がありません。</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let currentBook = null;
    let records = [];
    let cache = {};

    function loadStorage() {
      try {
        const r = localStorage.getItem('isbn_records_v1');
        if (r) records = JSON.parse(r);
        const c = localStorage.getItem('isbn_cache_v1');
        if (c) cache = JSON.parse(c);
      } catch(e) { records = []; cache = {}; }
    }

    function saveStorage() {
      localStorage.setItem('isbn_records_v1', JSON.stringify(records));
      localStorage.setItem('isbn_cache_v1', JSON.stringify(cache));
    }

    function normalizeISBN(raw) {
      return raw.replace(/[-\s]/g, '');
    }

    function isbn10to13(isbn10) {
      if (isbn10.length !== 10) return null;
      const core = '978' + isbn10.slice(0, 9);
      let sum = 0;
      for (let i = 0; i < 12; i++) sum += parseInt(core[i]) * (i % 2 === 0 ? 1 : 3);
      const check = (10 - (sum % 10)) % 10;
      return core + check;
    }

    function setStatus(msg, type = 'info') {
      const el = document.getElementById('searchStatus');
      el.textContent = msg;
      el.className = 'mt-3 text-sm ' + (type === 'error' ? 'text-red-500' : type === 'ok' ? 'text-green-600' : 'text-gray-500');
    }

    function showBook(info, isbn13) {
      currentBook = { ...info, isbn13 };
      document.getElementById('bookCard').classList.remove('hidden');
      document.getElementById('bookTitle').textContent = info.title || '(タイトル不明)';
      document.getElementById('bookAuthor').textContent = info.authors ? info.authors.join(', ') : '(著者不明)';
      document.getElementById('bookPublisher').textContent = info.publishers ? info.publishers.join(', ') : '-';
      document.getElementById('bookYear').textContent = info.publish_date || '-';
      document.getElementById('bookPages').textContent = info.number_of_pages ? info.number_of_pages + 'ページ' : '-';
      document.getElementById('bookISBN').textContent = isbn13;
      const coverUrl = `https://covers.openlibrary.org/b/isbn/${isbn13}-M.jpg`;
      const img = document.getElementById('bookCover');
      img.src = coverUrl;
      img.style.display = '';

      // 既存記録があれば反映
      const existing = records.find(r => r.isbn13 === isbn13);
      document.getElementById('readDate').value = existing ? existing.readDate || '' : '';
      document.getElementById('readRating').value = existing ? existing.rating || '' : '';
      document.getElementById('readMemo').value = existing ? existing.memo || '' : '';
    }

    async function fetchBook(isbn13) {
      const url = `https://openlibrary.org/api/books?bibkeys=ISBN:${isbn13}&format=json&jscmd=details`;
      const response = await fetch(url);
      if (!response.ok) throw new Error('API応答エラー');
      const data = await response.json();
      const key = `ISBN:${isbn13}`;
      if (!data[key]) throw new Error('書籍情報が見つかりませんでした');
      return data[key].details || {};
    }

    document.getElementById('searchBtn').addEventListener('click', async () => {
      const raw = document.getElementById('isbnInput').value.trim();
      if (!raw) { setStatus('ISBNを入力してください。', 'error'); return; }
      let isbn = normalizeISBN(raw);
      if (isbn.length === 10) isbn = isbn10to13(isbn) || isbn;
      if (isbn.length !== 13 || !/^\d+$/.test(isbn)) {
        setStatus('有効なISBN-13またはISBN-10を入力してください。', 'error');
        return;
      }

      setStatus('検索中...', 'info');
      document.getElementById('searchBtn').disabled = true;

      // キャッシュ確認
      if (cache[isbn]) {
        showBook(cache[isbn], isbn);
        setStatus('キャッシュから表示しました。', 'ok');
        document.getElementById('searchBtn').disabled = false;
        return;
      }

      try {
        const info = await fetchBook(isbn);
        cache[isbn] = info;
        saveStorage();
        showBook(info, isbn);
        setStatus('取得成功。', 'ok');
      } catch(e) {
        // キャッシュフォールバック済みなので無ければエラー
        setStatus('取得失敗: ' + e.message, 'error');
        document.getElementById('bookCard').classList.add('hidden');
      } finally {
        document.getElementById('searchBtn').disabled = false;
      }
    });

    document.getElementById('isbnInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('searchBtn').click();
    });

    document.getElementById('saveRecordBtn').addEventListener('click', () => {
      if (!currentBook) return;
      const readDate = document.getElementById('readDate').value;
      const rating = document.getElementById('readRating').value;
      const memo = document.getElementById('readMemo').value.trim();
      const idx = records.findIndex(r => r.isbn13 === currentBook.isbn13);
      const entry = {
        isbn13: currentBook.isbn13,
        title: currentBook.title || '(タイトル不明)',
        authors: currentBook.authors ? currentBook.authors.join(', ') : '',
        readDate, rating, memo,
        savedAt: new Date().toISOString(),
      };
      if (idx >= 0) { records[idx] = entry; } else { records.push(entry); }
      saveStorage();
      renderRecords();
      setStatus('読書記録を保存しました。', 'ok');
    });

    function stars(n) {
      if (!n) return '-';
      return '★'.repeat(Number(n)) + '☆'.repeat(5 - Number(n));
    }

    function renderRecords() {
      const tbody = document.getElementById('recordBody');
      while (tbody.firstChild) tbody.removeChild(tbody.firstChild);
      if (records.length === 0) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = 7; td.className = 'text-center text-gray-400 py-6'; td.textContent = '記録がありません。';
        tr.appendChild(td); tbody.appendChild(tr);
        return;
      }
      [...records].reverse().forEach((rec, ri) => {
        const i = records.length - 1 - ri;
        const tr = document.createElement('tr');
        tr.className = ri % 2 === 0 ? 'border-b border-gray-100' : 'border-b border-gray-100 bg-gray-50';
        const cells = [rec.title, rec.authors, rec.isbn13, rec.readDate || '-', stars(rec.rating), rec.memo || '-'];
        cells.forEach(txt => {
          const td = document.createElement('td');
          td.className = 'px-3 py-2 max-w-xs truncate';
          td.textContent = txt;
          tr.appendChild(td);
        });
        const tdDel = document.createElement('td');
        tdDel.className = 'px-3 py-2';
        const delBtn = document.createElement('button');
        delBtn.textContent = '削除';
        delBtn.className = 'text-red-500 hover:text-red-700 text-xs underline focus:outline-none';
        delBtn.setAttribute('aria-label', `${rec.title}を削除`);
        delBtn.setAttribute('tabindex', '0');
        delBtn.addEventListener('click', () => { records.splice(i, 1); saveStorage(); renderRecords(); });
        tdDel.appendChild(delBtn);
        tr.appendChild(tdDel);
        tbody.appendChild(tr);
      });
    }

    document.getElementById('clearRecordsBtn').addEventListener('click', () => {
      if (!confirm('全件削除しますか？')) return;
      records = [];
      saveStorage();
      renderRecords();
    });

    loadStorage();
    renderRecords();
  </script>
</body>
</html>
